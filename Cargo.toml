[workspace]
resolver = "3"
members = ["rshell", "rshell-cli", "rshell-config"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"

[workspace.lints.clippy]
perf = { level = "deny", priority = -1 }

allow_attributes_without_reason = "deny"
branches_sharing_code = "warn"
collapsible_else_if = "deny"
incompatible_msrv = "forbid"
needless_return = "allow"
new_without_default = "warn"

[profile.release]
lto = true
codegen-units = 1

[workspace.dependencies]
rshell = { path = "rshell" }
rshell-cli = { path = "rshell-cli" }
rshell-config = { path = "rshell-config" }
